<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!--meta tags for search engines-->
    <meta 
        name="description" 
        content="Love Running. The club for runners. 
        Park Run. Campus Run. City Run. City Triathalon."
    >
    <meta 
        name="keyword" 
        content="love running, Germany, Berlin, club for runners, runners, 
        sports, fitness, exercise"
    >
    <title>Love Running</title>
    <!--Favicon sources-->
    <link rel="apple-touch-icon" sizes="180x180" href="assets/favicon/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon/favicon-16x16.png">
    
    <!--css styles-->
    <link rel="stylesheet" href="./assets/css/styles.css">
</head>
<body>
    <!--main header-->
    <header>
        <a href="index.html">
            <h1 id="logo">
                Love Running
            </h1>
        </a>

        <!--toggle navbar-->
        <input type="checkbox" id="nav-toggle" name="nav-toggle">
        <label for="nav-toggle" class="nav-toggle-label"><i class="fa-solid fa-bars"></i></label>

        <!--navbar-->    
        <nav>
            <ul id="menu">
                <li>
                    <a href="index.html">Home</a>
                </li>

                <li>
                    <a href="gallery.html">Gallery</a>
                </li>

                <li>
                    <a href="signup.html" class="active">Sign Up</a>
                </li>
            </ul>
        </nav>
    </header>
    <!--main content-->
    <main>
        <section id="signup">
            <h1 class="hidden-heading">Signup to run</h1>
            <form action="https://formdump.codeinstitute.net" id="signup-form" method="POST">
                <h1><i class="fa-solid fa-heart-pulse"></i> Let's get you signed up!</h1>
            
                <label for="first-name">First Name</label><input type="text" id="first-name" name="first-name" required class="text-input">
                <br>
                <label for="last-name">Last Name</label><input type="text" id="last-name" name="last-name" required class="text-input">
                <br>
                <label for="email">Email</label><input type="email" id="email" name="email" class="text-input" required>

                <div class="radio-buttons">
                    <div>
                        <label for="road">Road</label>
                        <input type="radio" name="running_preference" id="road" value="road" required checked>
                    </div>
                    <div>
                        <label for="trail">Trail</label>
                        <input type="radio" name="running_preference" id="trail" value="trail" required>
                    </div>
                    <div>
                        <label for="both">Both</label>
                        <input type="radio" name="running_preference" id="both" value="both" required>
                    </div>
                </div>
                <button type="submit" class="join-button">Let's Run!</button>
            </form>
        </section>
    </main>
    <!--footer-->
    <footer>
        <!--social media links-->
        <ul id="social-media">
            <li>
                <a 
                    href="https://www.facebook.com/?locale=de_DE" target="_blank" rel="noopener" 
                    aria-label="Open our facebook page (opens in new tab)"
                >
                <i class="fa-brands fa-facebook"></i><!--facebook icon-->
                </a>
            </li>

            <li>
                <a href="https://instagram.com" target="_blank" rel="noopener" 
                    aria-label="open our instagram page (opens in new tab)"
                >
                <i class="fa-brands fa-instagram"></i><!--instagram icon-->
                </a>
            </li>
            <li>
                <a href="https://youtube.com" target="_blank" rel="noopener" 
                aria-label="go to our youtube channel (opens in new tab)"
                >
                <i class="fa-brands fa-youtube"></i><!--youtube icon-->
                </a>
            </li>
            <li>
                <a href="https://x.com/?lang=de" target="_blank" rel="noopener" 
                    aria-label="open our twitter feed (now known as X)(opens in new tab)"
                >
                <i class="fa-brands fa-x-twitter"></i><!--X(twitter) icon-->
                </a>
            </li>
        </ul>
    </footer>
    <!--font awesome source-->
    <script src="https://kit.fontawesome.com/cac93a8152.js" crossorigin="anonymous"></script>
</body>
</html>
