<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!--meta tags for search engines-->
    <meta 
        name="description" 
        content="Love Running. The club for runners. 
        Park Run. Campus Run. City Run. City Triathalon."
    >
    <meta 
        name="keyword" 
        content="love running, club for runners, runners, 
        sports, fitness, exercise"
    >
    <title>Love Running</title>
    <!--Favicon sources-->
    <link rel="apple-touch-icon" sizes="180x180" href="assets/favicon/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon/favicon-16x16.png">
    
    <!--css styles-->
    <link rel="stylesheet" href="./assets/css/styles.css">
</head>
<body>
    <!--main header-->
    <header>
        <a href="index.html">
            <h1 id="logo">
                Love Running
            </h1>
        </a>

        <!--toggle navbar-->
        <input type="checkbox" id="nav-toggle" name="nav-toggle">
        <label for="nav-toggle" class="nav-toggle-label"><i class="fa-solid fa-bars"></i></label>

        <!--navbar-->    
        <nav>
            <ul id="menu">
                <li>
                    <a href="index.html">Home</a>
                </li>

                <li>
                    <a href="gallery.html" class="active">Gallery</a>
                </li>

                <li>
                    <a href="signup.html">Sign Up</a>
                </li>
            </ul>
        </nav>
    </header>
    <!--main content-->
    <main>

        <section id="gallery">
            <div id="photos">
                <img src="assets/images/athletes.webp" alt="Two athletes running together">
                <img src="assets/images/girls.webp" alt="Three girls at charity paint festival">
                <img src="assets/images/man.webp" alt="Man at a charity paint festival">
                <img src="assets/images/mud-run.webp" alt="Two women taking a muddy selfie at a mud runners chamionship">
                <img src="assets/images/runner1.webp" alt="Woman jogging through park">
                <img src="assets/images/runner2.webp" alt="Runners at a marathon">
                <img src="assets/images/runner3.webp" alt="Man jogging on beach">
                <img src="assets/images/runner4.webp" alt="Woman jogging on beach">
                <img src="assets/images/running_gang.webp" alt="A running group taking part in a marathon on a rainy day.">
            </div>
        </section>

    </main>
    <!--footer-->
    <footer>
        <!--social media links-->
        <ul id="social-media">
            <li>
                <a 
                    href="https://www.facebook.com/?locale=de_DE" target="_blank" rel="noopener" 
                    aria-label="Open our facebook page (opens in new tab)"
                >
                <i class="fa-brands fa-facebook"></i><!--facebook icon-->
                </a>
            </li>

            <li>
                <a href="https://instagram.com" target="_blank" rel="noopener" 
                    aria-label="open our instagram page (opens in new tab)"
                >
                <i class="fa-brands fa-instagram"></i><!--instagram icon-->
                </a>
            </li>
            <li>
                <a href="https://youtube.com" target="_blank" rel="noopener" 
                aria-label="go to our youtube channel (opens in new tab)"
                >
                <i class="fa-brands fa-youtube"></i><!--youtube icon-->
                </a>
            </li>
            <li>
                <a href="https://x.com/?lang=de" target="_blank" rel="noopener" 
                    aria-label="open our twitter feed (now known as X)(opens in new tab)"
                >
                <i class="fa-brands fa-x-twitter"></i><!--X(twitter) icon-->
                </a>
            </li>
        </ul>
    </footer>
    <!--font awesome source-->
    <script src="https://kit.fontawesome.com/cac93a8152.js" crossorigin="anonymous"></script>
</body>
</html>
